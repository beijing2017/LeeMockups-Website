name: Deploy LeeMockups download worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloudflare/**
      - .github/workflows/deploy-download-worker.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKER_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: leemockups-download
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify the dedicated deployment credentials and existing bindings
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_WORKER_DEPLOY_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_WORKER_DEPLOY_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/settings" \
            | jq -e '(["DB", "DOWNLOAD_SECRET", "MOCKUPS"] - [.result.bindings[].name] | length) == 0'
      - name: Migrate the existing analytics verifier to a Worker secret before deployment
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.SCRIPT_NAME}`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_WORKER_DEPLOY_TOKEN}` };
          const settingsResponse = await fetch(`${base}/settings`, { headers });
          const settings = await settingsResponse.json();
          if (!settingsResponse.ok || !settings.success) throw new Error('Could not inspect Worker settings.');
          if (settings.result.bindings.some(({ name }) => name === 'ANALYTICS_ACCESS_HASH')) {
            console.log('Analytics verifier secret is already configured.');
            process.exit(0);
          }

          const previousSource = execFileSync('git', ['show', 'HEAD^:cloudflare/leemockups-download.js'], { encoding: 'utf8' });
          const match = previousSource.match(/^const ANALYTICS_ACCESS_HASH = "([A-Za-z0-9_-]{43})";$/m);
          if (!match) throw new Error('The previous analytics verifier was not found; deployment stopped.');
          const response = await fetch(`${base}/secrets`, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: 'ANALYTICS_ACCESS_HASH', text: match[1], type: 'secret_text' }),
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(`Could not configure analytics verifier secret (${response.status}); deployment stopped.`);
          console.log('Existing analytics verifier moved to a Worker secret.');
          NODE
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_WORKER_DEPLOY_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/settings" \
            | jq -e '(["DB", "DOWNLOAD_SECRET", "MOCKUPS", "ANALYTICS_ACCESS_HASH"] - [.result.bindings[].name] | length) == 0'
      - name: Deploy the reviewed Worker module without changing bindings or secrets
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_WORKER_DEPLOY_TOKEN}" \
            --form 'metadata={"main_module":"leemockups-download.js"};type=application/json' \
            --form 'worker.js=@cloudflare/leemockups-download.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/content")"
          cat "$response_file" | jq .
          test "$status" -ge 200 -a "$status" -lt 300
          jq -e '.success == true' "$response_file"
      - name: Reconfirm bindings and public-preview route
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_WORKER_DEPLOY_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/settings" \
            | jq -e '(["DB", "DOWNLOAD_SECRET", "MOCKUPS", "ANALYTICS_ACCESS_HASH"] - [.result.bindings[].name] | length) == 0'
          test "$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
            "https://downloads.leemockups.com/mockups/LM-VM-MUG-001/LM-VM-MUG-001-thumb.webp")" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"orderNumber":"invalid","email":"invalid"}' \
            "https://downloads.leemockups.com/redeem")" = 400
