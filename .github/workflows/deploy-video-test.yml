name: Deploy isolated LeeMockups video test

on:
  workflow_dispatch:
  push:
    branches: [codex/cloudflare-video-test]
    paths:
      - cloudflare/video-test/**
      - .github/workflows/deploy-video-test.yml
  pull_request:
    branches: [main]
    paths:
      - cloudflare/video-test/**
      - .github/workflows/deploy-video-test.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/video-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_TEST_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/video-test/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify isolated target name
        run: |
          grep -q '"name": "leemockups-video-test"' wrangler.jsonc
      - name: Verify Containers API access
        run: |
          response="$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/me")"
          echo "$response" | jq '{success, errors, messages}'
          echo "$response" | jq -e '.success == true'
      - run: npm run deploy
