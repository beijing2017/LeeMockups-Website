name: Test free browser package route

on:
  pull_request:
    paths:
      - cloudflare/**
      - .github/workflows/test-free-browser-package.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloudflare/free-download.test.mjs
